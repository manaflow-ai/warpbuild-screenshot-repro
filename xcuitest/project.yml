name: HostApp
options:
  bundleIdPrefix: com.cmux.probe
  deploymentTarget:
    macOS: "13.0"
settings:
  base:
    CODE_SIGN_IDENTITY: "-"
    CODE_SIGNING_REQUIRED: "NO"
    CODE_SIGNING_ALLOWED: "YES"
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    GENERATE_INFOPLIST_FILE: "YES"
targets:
  HostApp:
    type: application
    platform: macOS
    sources: [HostApp]
    info:
      path: HostApp/Info.plist
      properties:
        CFBundleName: HostApp
        LSUIElement: false
        LSMinimumSystemVersion: "13.0"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmux.probe.HostApp
  HostAppUITests:
    type: bundle.ui-testing
    platform: macOS
    sources: [HostAppUITests]
    dependencies:
      - target: HostApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmux.probe.HostAppUITests
        TEST_TARGET_NAME: HostApp
  # Unit test hosted IN the app (TEST_HOST) — this matches cmux app-host-unit-tests,
  # which run XCTest inside cmux DEV.app, NOT XCUITest. The host app is the
  # launched process and can get key-window without a separate runner activation.
  HostAppUnitTests:
    type: bundle.unit-test
    platform: macOS
    sources: [HostAppUnitTests]
    dependencies:
      - target: HostApp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.cmux.probe.HostAppUnitTests
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/HostApp.app/Contents/MacOS/HostApp"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  HostApp:
    build:
      targets:
        HostApp: all
        HostAppUITests: [test]
    test:
      targets:
        - HostAppUITests
  HostAppUnit:
    build:
      targets:
        HostApp: all
        HostAppUnitTests: [test]
    test:
      targets:
        - HostAppUnitTests
